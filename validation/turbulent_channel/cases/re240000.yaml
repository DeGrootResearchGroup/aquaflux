# Fully-developed turbulent channel at Re_b = U_b H / nu = 240000, against the log law.
#
# Streamwise-periodic, wall-resolved (the first cell's y+ < 1), k-omega SST, the bulk velocity held
# at U_b = 1 by a solved body force. Full height H = 2 (half-height h = 1, which Re_tau is based on).
# nu = U_b H / Re_b.

mesh:
  kind: StructuredGrid
  cells: [4, 224]
  lengths: [1.0, 2.0]
  periodic: [x]
  # Wall-normal cells growing by 1.052 from each wall toward the centre.
  grading:
    y: {kind: GeometricGrading, growth: 1.052}

fluid:
  density: 1.0
  kinematic_viscosity: 8.333333333333334e-06

physics:
  kind: RANS
  advection: {kind: FirstOrderUpwind}

boundaries:
  bottom: {kind: Wall, k: zero}
  top: {kind: Wall, k: zero}

numerics:
  momentum_advection: {kind: FirstOrderUpwind}
  gradient: {kind: CompactGreenGauss}

# The body force is solved for so that <U_x> = 1 holds exactly at every step; initial_force is where
# that solve starts.
drive: {kind: BulkVelocity, target: 1.0, direction: x, initial_force: 0.00175}

# A periodic channel has no outlet to set the pressure level, so it is fixed at a point.
pressure_datum: {kind: PinnedPoint, point: [0.0, 0.0]}

# Solved by alternating the flow and the closure, which is the solve that holds the bulk velocity.
solver:
  kind: Segregated
  # The most outer sweeps; the solve stops earlier once a sweep changes the fields by less than its
  # increment tolerance.
  sweeps: 150
  relaxation: 0.9
  # The channel is four cells wide, so the bordered flow system is small enough to factor exactly.
  flow_solve:
    kind: RootSolve
    linear_solver: {kind: DirectSolve}
  # At near-wall aspect ratios of ~10^3 the k and omega operators are ill-conditioned (their condition
  # number grows like the aspect ratio squared), so they need the mesh-independent convection-diffusion
  # multigrid, a tolerance above that operator's noise floor, and a deeper step budget -- a backstop,
  # since the solve stops on its tolerance.
  scalar_solve:
    kind: RootSolve
    max_steps: 400
    convergence: {kind: Convergence, rtol: 1.0e-8, atol: 1.0e-10}
  scalar_preconditioner: {kind: ScalarAir}
