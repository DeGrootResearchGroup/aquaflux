# Generated by validation/sudo_bend/write_grids.py -- edit that, not this file.
# The round64 grid of the bend's grid study: 64 points round the pipe, 1.77778 times the
# coarsest grid's resolution round it and along it.
#
# Fully developed turbulent flow in the bend's pipe, for the bend's inflow: the periodic pipe held at
# Re = U_b D / nu = 6.0e4 by a solved body force, k-omega SST with wall functions.
mesh:
  kind: AquafluxMesh
  path: work/precursor.aqmesh

# Air, as in the experiment. U_b = 6.0e4 * 1.5e-5 / 0.104 m/s.
fluid:
  density: 1.2
  kinematic_viscosity: 1.5e-05

physics:
  kind: RANS

# The walls' first cells sit near y+ = 40, so k has no wall value: the wall functions carry it.
boundaries:
  walls: {kind: Wall, k: zero_gradient}

# A developed flow does not change along the pipe and has no velocity across it, so advection
# carries nothing and its scheme hardly moves the profiles; first order marches most simply.
numerics:
  momentum_advection: {kind: FirstOrderUpwind}
  turbulence_advection: {kind: FirstOrderUpwind}
  gradient: {kind: MultipleCorrectionGradient}

# initial_force is where the solve for the force starts: the Blasius friction factor's pressure
# gradient, 4 tau_w / D with tau_w = 0.0791 Re^-1/4 (rho U_b^2 / 2).
drive: {kind: BulkVelocity, target: 8.653846153846153, direction: x, initial_force: 8.7}

# A periodic pipe has no outlet to set the pressure level, so it is fixed at a point.
pressure_datum: {kind: PinnedPoint, point: [0.052, 0.0, 0.0]}

# Marched monolithically, the bulk velocity held by a force solved with the flow; a block-diagonal
# preconditioner, since the bordered system a held bulk velocity adds is not one the materialized
# Jacobian holds.
solver:
  kind: CoupledMarch
  max_steps: 300
  convergence: {kind: Convergence, rtol: 1.0e-8, atol: 1.0e-10}
  preconditioner: {kind: BlockDiagonal, scalar: {kind: ScalarAir}}
  dual_time: {kind: DualTimeLoop, inner_steps: 3}

# Beside the fields, the developed flow's profiles against the distance from the pipe's axis: the
# table the bend's inlet admits (case.yaml).
outputs:
  directory: work/precursor
  fields:
    - {kind: Vtk}
    - {kind: RadialProfiles, file: profiles.csv, centre: [0.0, 0.0, 0.0], axis: [1.0, 0.0, 0.0], bands: 40}
  checkpoints: {kind: Checkpoints, every: 10, keep: 2}
