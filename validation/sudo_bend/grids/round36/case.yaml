# Generated by validation/sudo_bend/write_grids.py -- edit that, not this file.
# The round36 grid of the bend's grid study: 36 points round the pipe, 1 times the
# coarsest grid's resolution round it and along it.
#
# The Sudo, Sumida & Hibara (1998) 90-degree bend at Re = U_b D / nu = 6.0e4, k-omega SST with wall
# functions, entering with the developed flow of its own pipe (precursor.yaml, on this grid's
# cross-section), admitted by its profiles against the distance from the inlet's centre:
#
#   aquaflux mesh mesh.yaml && aquaflux mesh precursor_mesh.yaml
#   aquaflux run precursor.yaml && aquaflux run case.yaml
mesh:
  kind: AquafluxMesh
  path: work/bend.aqmesh

fluid:
  density: 1.2
  kinematic_viscosity: 1.5e-05

# The precursor's physics, so the inflow is a developed flow of these equations; omega is solved as
# its logarithm, which changes the march, not the root.
physics:
  kind: RANS
  omega_variable: {kind: LogScalars}

boundaries:
  inlet: {kind: DevelopedInlet, profile_table: work/precursor/profiles.csv}
  outlet: {kind: Outlet, pressure: 0.0}
  walls: {kind: Wall, k: zero_gradient}

numerics:
  momentum_advection:
    kind: LimitedUpwind
    limiter: {kind: VenkatakrishnanLimiter}
  turbulence_advection: {kind: FirstOrderUpwind}
  gradient: {kind: MultipleCorrectionGradient}

# bfs3d's march (validation/bfs3d_openfoam/case.yaml, where each setting's measurement is recorded),
# unchanged: the field split of the materialized Jacobian, the dual-time loop, the step control and
# the viscosity ramp from 100 times the fluid's viscosity. The probe reaches as bfs3d's does: the
# pressure column (u, v, w, p, k, omega) at 3, whose couplings at distance 3 matter on stretched
# cells, and the rest at 2, which halved bfs3d's probe without losing steps; not measured here.
solver:
  kind: CoupledMarch
  max_steps: 150
  convergence: {kind: Convergence, rtol: 0.0, atol: 1.0e-05}
  preconditioner:
    kind: MaterializedJacobian
    inverse:
      kind: FieldSplit
      leading: {kind: SimpleSmoothed, sweeps: 2, pressure_sweeps: 2, smoother_weight: 1.0, aggressive_levels: 0,
        avoid_singletons: true, block_splitting: true, strength_threshold: 0.25, max_levels: 5, max_coarse: 500,
        frozen_coarsening: true}
      trailing: {kind: JacobiSmoothed, max_coarse: 200, aggressive_levels: 0, equilibrate: false, avoid_singletons: false,
        strength_threshold: 0.25, max_levels: 20, frozen_coarsening: true}
      precision: float32
    probe: {kind: JacobianProbeSpec, stencil_reach: 3, column_reach: [2, 2, 2, 3, 2, 2]}
    pivot_floor: {kind: PivotFloor, threshold: 0.15}
  dual_time: {kind: DualTimeLoop, inner_steps: 5, inner_tol: 0.01, cycle_budget: 42, refresh_on_cycles: 4}
  linear_solve: {kind: LinearSolveSettings, rtol: 0.3, restart: 15, max_restarts: 14, stop: residual}
  step_control: {kind: CflResidualDualTimeControl, beta_start: 0.5, beta_min: 0.005, grow: 3.0,
    release_floor: 1.0e-4, release_backoff: 0.5}
  retry:
    kind: RetryPolicy
    solver: {kind: GmresSolve, rtol: 0.0001, restart: 40}
    abort_above_cycles: 10
    on_alpha: 0.01
  turbulence_damping: 3.0
  continuation: {kind: ViscosityRamp, anchor: 100.0, stations: 12, steps_per_station: 1, scale: flow}

outputs:
  directory: work/results
  fields: [{kind: Vtk}, {kind: PatchVtk}]
  checkpoints: {kind: Checkpoints, every: 1, keep: 3}
