# The straight pipe the bend's inflow develops in (geometry.py draws precursor.step): one diameter
# of the bend's pipe, its two ends joined into one periodic seam so the flow leaving it enters it
# again, until the flow no longer changes along it.
#
# Meshed with the bend's settings (mesh.yaml) so its cross-section is the bend inlet's: 36 points
# round, the same core and wall layers. Its rows stay even: nothing joins either end to grade from.
drawing: {file: precursor.step}
region: {solids: [fluid]}
sizes: {max_size: 0.01, feature_angle: 0.785}
patches:
  start: {kind: FacesNear, points: [[0.0, 0.0, 0.0]]}
  end: {kind: FacesNear, points: [[0.104, 0.0, 0.0]]}
layers: {kind: PrismLayers, first_height: 0.0025, growth: 1.2, count: 4}
layered: [walls]
periodic: {kind: PeriodicJoin, first: end, second: start}
output: {path: work/precursor.aqmesh}
