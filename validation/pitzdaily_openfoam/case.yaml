# pitzDaily -- the 2D backward-facing step, described as a case file.
#
# This is the case compare.py solves, and how it solves it: compare.py reads this file, applies any
# study override (a PITZ_* setting in the environment, or a model / gradient passed in code) as an
# edit of it, builds it with aquaflux.case and solves it with the solver below. The measurements
# behind each march setting are recorded beside its override in compare.py.
# validation/case_file_parity.py checks that this file builds the same problem, bit for bit, as the
# case compare.py used to assemble by hand.

mesh:
  kind: OpenFOAMMesh
  path: runs/kwsst/polyMesh

# The OpenFOAM tutorial's operating point: incompressible, kinematic (rho = 1).
fluid:
  density: 1.0
  kinematic_viscosity: 1.0e-5

physics:
  kind: RANS
  # omega = e^w stays positive under any Newton step. k stays direct: log(k) is ill-conditioned where
  # k -> 0 at the walls.
  omega_variable: {kind: LogScalars}
  # Freeze the k-production cap in the linearization, as the sibling bfs3d case does. Left exact, the
  # cap's own derivative destabilizes the march; the library default is the exact operator, so omitting
  # this silently gives the two cases different Newton operators on the same physics.
  explicit_production_limiter: true

boundaries:
  inlet:
    kind: Inlet
    velocity: [10.0, 0.0]
    turbulence: {kind: FixedTurbulence, k: 0.375, omega: 440.15}
  outlet: {kind: Outlet, pressure: 0.0}
  # Zero-gradient k at the walls: a different discrete problem from the textbook k = 0, with its own
  # reattachment length, and the one the sibling case runs.
  upperWall: {kind: Wall, k: zero_gradient}
  lowerWall: {kind: Wall, k: zero_gradient}

numerics:
  # Second-order upwind momentum advection: the upwind cell reconstructed to the face with its
  # gradient, slope-limited -- the analogue of OpenFOAM's `Gauss linearUpwind`.
  momentum_advection:
    kind: LimitedUpwind
    limiter: {kind: VenkatakrishnanLimiter}
  # First-order upwind on k and omega. The negative-omega failure of a second-order scheme on the stiff
  # omega equation is a Newton-update overshoot at the cell centre, not a face-value one, so a slope
  # limiter does not prevent it; first-order upwind keeps the omega transport operator diagonally
  # dominant (an M-matrix), which is what keeps the shifted Newton step positive.
  turbulence_advection: {kind: FirstOrderUpwind}
  # The two-face-pass reconstruction: quadratic-exact with no solve. On a scalar residual it reaches
  # exactly distance 3; the coupled residual here reaches 4 (see the probe below).
  gradient: {kind: MultipleCorrectionGradient}

solver:
  kind: CoupledMarch
  # Per march segment; the march stops on its tolerance well before it.
  max_steps: 150
  # An absolute bar, in the row-scaled measure the march steers by, so the stop does not depend on
  # how far the ramp's first station opened from its root.
  convergence: {kind: Convergence, rtol: 0.0, atol: 1.0e-05}
  # The materialized coupled Jacobian, split into the [u, v, p] saddle and the [k, omega] block: a
  # SIMPLE-smoothed hierarchy for the saddle (which never eliminates the matrix, so it does not depend
  # on an elimination order) and a Jacobi-smoothed one for the closure. Refitted at a shift no lower
  # than 0.05.
  preconditioner:
    kind: MaterializedJacobian
    inverse:
      kind: FieldSplit
      leading: {kind: SimpleSmoothed, sweeps: 2, pressure_sweeps: 2, omega: 1.0, aggressive_levels: 0,
        avoid_singletons: true, block_splitting: true, strength_threshold: 0.25, max_levels: 5, max_coarse: 500}
      trailing: {kind: JacobiSmoothed, max_coarse: 2000, equilibrate: false}
    # Reach 3 is NOT exact for this coupled residual: the velocity gradient feeds the eddy viscosity,
    # which spends one more ring, so the u and v columns (and, weakly, k into omega) reach 4. At reach 3
    # the far coupling is folded onto near entries, relative error up to ~5e-6 per block at the
    # OpenFOAM state; reach 4 is exact to round-off but costs 265 probes against 165
    # (validation/pitzdaily_openfoam/probe_reach_check.py). Kept at 3 pending a march comparison.
    probe: {kind: JacobianProbeSpec, stencil_reach: 3}
    refit_beta_floor: 0.05
  # Each outer step a dual-time inner loop of up to five Newton iterations, stopping at a hundredth of
  # the step's starting residual; the preconditioner is refitted mid-step once a solve runs 2 restart
  # cycles (counted as cycles run, the residual stop's count; 2 measured fastest of 2-4 under it).
  dual_time: {kind: DualTimeLoop, inner_steps: 5, inner_tol: 0.01, cycle_budget: 42, refresh_on_cycles: 2}
  # An inexact-Newton stop on each inner solve, tested every iteration on the residual alone (about half
  # the march's time against the default stop, which also demands a settled solution and tests only at
  # restarts); the restart cap sits above the retry threshold below, so a solve past it is escalated
  # rather than accepted truncated.
  linear_solve: {kind: LinearSolveSettings, rtol: 0.3, restart: 15, max_restarts: 14, stop: residual}
  # Grow the pseudo-timestep while the inner loop takes full steps and the residual is not rising, three
  # times per comfortable step, so the shift reaches its floor in about seven steps, while the viscosity
  # ramp below is still running. Floor steps at a raised viscosity take their full timestep and settle the
  # state; the ramp then arrives about one step after it has. Once a step on the case's own viscosity has
  # run at the floor at full length, the shift drops to a ten-thousandth, so the last steps are inexact
  # Newton steps rather than a linear tail at the floor. Measured: 16 steps / 111 restart cycles, against
  # 31 / 161 at the previous growth of 1.5, 16 stations and no release, to the same reattachment length.
  step_control: {kind: CflResidualDualTimeControl, beta_start: 0.5, beta_min: 0.005, grow: 3.0,
    release_floor: 1.0e-4}
  # Redo a step whose line search collapses at twice the shift; a step still non-finite after that is
  # redone with a tight solve.
  retry:
    kind: RetryPolicy
    solver: {kind: GmresSolve, rtol: 0.0001, restart: 40}
    abort_above_cycles: 10
    on_alpha: 0.01
  # The k and omega rows damped three times harder than the flow's: the ramp weakens the momentum
  # equation's nonlinearity directly, while the closure's stiff sources are what the shift addresses.
  turbulence_damping: 3.0
  # k is projected back to zero after a step rather than the step being shortened to keep it positive.
  positivity_floor: 0.0
  positivity_projection: true
  # From a cold start at the case's viscosity the march integrates a long transient to develop the
  # recirculation. Start at a hundred times the viscosity -- the momentum equation's only, so the
  # closure keeps its target near-wall omega -- and walk it down in 12 stations of one step each: long
  # enough for the state to settle at the shift's floor before the target, and no longer.
  continuation: {kind: ViscosityRamp, anchor: 100.0, stations: 12, steps_per_station: 1, scale: flow}
