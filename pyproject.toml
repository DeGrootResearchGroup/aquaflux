# PEP 639 SPDX license metadata needs setuptools >= 77.
[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "aquaflux"
# Single-sourced from ``aquaflux.__version__`` via [tool.setuptools.dynamic]
# below, so the version lives in exactly one place (aquaflux/__init__.py).
dynamic = ["version"]
description = "Differentiable unstructured finite-volume flow solver in JAX, purpose-built to couple with aquakin for reactive environmental transport"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Christopher DeGroot", email = "christopher.degroot@uwo.ca" }]
keywords = ["cfd", "finite-volume", "differentiable", "jax", "unstructured", "adjoint"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    # JAX core (AD + jit). Floors are the tested baseline; no upper caps
    # (upper-bounding deps propagates to consumers and causes resolver
    # conflicts — pin exact versions for CI in a committed constraints lock).
    "jax>=0.10",
    "jaxlib>=0.10",
    # equinox: jit/grad-native OO modules (`equinox.Module`). The mesh, geometry, and
    # the strategy hierarchies (operators/schemes/BCs/solvers) are Modules. Already a
    # transitive dependency (diffrax and lineax are built on equinox), so no new
    # footprint — pinned explicitly because the code imports it directly.
    "equinox>=0.11",
    # lineax: JAX-native linear solves with implicit differentiation — the
    # linear-solve adjoint seam (briefing §10). `jax.scipy.sparse.linalg` is the
    # fallback. The coupled block preconditioner is the top research risk;
    # `jaxamg` is the first build-on candidate to evaluate (briefing §11.8).
    "lineax>=0.0.5",
    # Diffrax: transient integration, shared with aquakin. The PDE core is a
    # DAE-residual engine; aquakin's ODE reactors are the special case.
    "diffrax>=0.7",
    "numpy>=1.24",
    "scipy>=1.10",
    # Numba: compiled host loops for work whose value is in what it SKIPS, which neither a traced
    # JAX loop (static trip count, so every item pays the worst case) nor numpy passes (a whole-array
    # pass per step over every item still in flight) can do cheaply. Its consumer is the triangle
    # grid's walk (`aquaflux/radiation/grid_walk.py`), each ray walked to its first hit. 0.61 is the
    # first release with wheels for Python 3.13.
    "numba>=0.61",
    # filelock: the inter-process lock JAX's *bounded* persistent compilation cache takes
    # when evicting. It is a hard dependency rather than an optional one because of how its
    # absence presents: with a size bound set and filelock missing, every cache read and
    # write fails with a warning and the cache silently stores nothing -- worse than having
    # no bound at all. `aquaflux/__init__.py` degrades to an unbounded cache if it is
    # somehow absent, but the bound is the point, so it ships as a dependency.
    "filelock>=3.12",
    # PyYAML: parses a case file (`aquaflux.case`). Only the parse is YAML-specific --
    # every section is read from the parsed mapping by `solve.SettingsMapping`, which
    # also does the validation, so pydantic is deliberately not a dependency.
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# `lint` pins the linters so a new release cannot turn the gate red without a
# deliberate bump. ruff is capped to the 0.15 series; codespell to the 2.x
# series. Raise a cap intentionally.
lint = ["ruff>=0.15,<0.16", "codespell>=2.3,<3"]
# `test` is the CI toolchain. pytest-xdist parallelizes within a job (`-n`);
# pytest-split shards the suite across jobs (`--splits`/`--group`) so each runs
# in a fresh process, which bounds the JAX/XLA memory a long-lived run
# accumulates (the flow-solve integration and validation tests otherwise grow
# past the hosted runner's RAM); pytest-timeout fails a deadlocked test by name
# instead of hanging the job.
test = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-xdist>=3.6",
    "pytest-split>=0.9",
    "pytest-timeout>=2.3",
    # The CAD reader's tests need its kernel. It has wheels for every interpreter CI runs, so it is
    # carried here and those tests run there -- unlike `petsc`, whose absence from CI is a recorded
    # cost (tests/unit/test_optional_dependency_skips.py).
    "aquaflux[cad]",
]
# `docs` is the Sphinx toolchain for the site under `docs/` — MyST Markdown pages,
# the pydata theme, and the copy-button extension; autodoc imports the package
# itself, so the docs build needs aquaflux installed alongside these. Read the Docs
# installs this extra (see `.readthedocs.yaml`). The build runs with
# `fail_on_warning`, which makes any warning a hard failure — so a major release of
# Sphinx or the theme can turn the build red on its own. Each is capped below the
# next major; raise a cap intentionally.
docs = [
    "sphinx>=7.2,<9",
    # The `linkify` extra pulls `linkify-it-py`, which MyST's `linkify` extension
    # (enabled in `docs/conf.py`) requires. Without it the parser raises on the
    # first inline token of the first page, so every page fails, not just pages
    # containing a bare URL.
    "myst-parser[linkify]>=2.0,<5",
    "pydata-sphinx-theme>=0.15,<1",
    "sphinx-copybutton>=0.5,<1",
]
# `cad` is the kernel `aquaflux.io.cad.read_step` reads STEP files through: OpenCASCADE Technology,
# by its Python binding OCP. Pinned exactly, because the binding's API moves between releases
# (collection types renamed, static methods losing their suffix) and every call to it lives in
# `aquaflux/io/cad/kernel.py` against this one version. The `-novtk` build is the same `OCP` module
# without the VTK visualization toolkit (a further large wheel nothing here uses); it cannot be
# installed beside `cadquery`, which brings the VTK build of the same module. Wheels exist for
# CPython 3.11-3.14 on Linux, macOS and Windows, and none for 3.10, which is why the floor is 3.11.
cad = ["cadquery-ocp-novtk==8.0.1.0.0"]
# `petsc` (petsc4py) backs two coupled preconditioners. For the complete-LU
# (`coupled_lu_continuation`) it is the optional fast backend — UMFPACK (SuiteSparse) factors the coupled
# Jacobian roughly an order of magnitude faster than the threshold-ILU on a moderate 2D mesh; without it
# that preconditioner falls back to scipy's SuperLU (exact but not faster to factor). For the algebraic
# multigrid (`coupled_amg_continuation`, the large-3D coupled preconditioner) it is **required** — the
# V-cycle is built with PETSc's `PCGAMG` and there is no pure-SciPy AMG fallback. The ILUT / block
# preconditioners are unaffected. petsc4py builds PETSc from source; a SuiteSparse-enabled build needs
# CMake (`PETSC_CONFIGURE_OPTIONS="--download-suitesparse"`).
petsc = ["petsc4py>=3.20"]

[project.scripts]
# `aquaflux check case.yaml` / `aquaflux run case.yaml`; `python -m aquaflux` is the same command.
aquaflux = "aquaflux.__main__:main"

[project.urls]
Repository = "https://github.com/DeGrootResearchGroup/aquaflux"

[tool.setuptools.dynamic]
version = { attr = "aquaflux.__version__" }

[tool.setuptools.packages.find]
# Only package `aquaflux*`. The repo root also holds documentation, tests, and
# runnable validation cases — none of which belong in the installed distribution.
include = ["aquaflux*"]

[tool.ruff]
line-length = 100
target-version = "py311"
# Lint only the package and its tests; everything else in the repo is out of
# scope for the style gate.
src = ["aquaflux", "tests"]

[tool.ruff.lint]
#   E,W  pycodestyle     F   pyflakes            I    isort
#   B    flake8-bugbear  RUF ruff-specific       NPY  numpy (incl. NumPy-2.0 API)
#   PIE  flake8-pie      ICN import-conventions  FA   future-annotations
#   UP   pyupgrade
# Fresh codebase: start strict, keep it strict (no deferred-issue backlog to
# carry). Add rules deliberately; do not silence findings with blanket ignores.
select = ["E", "F", "W", "I", "B", "RUF", "NPY", "PIE", "ICN", "FA", "UP"]
ignore = [
    # `ruff format` owns line width; E501 on un-splittable lines (URLs, refs) is
    # noise, not an actionable finding.
    "E501",
    # Intentional scientific Unicode in docstrings/comments (µ, α, β, ×, ⁻, °, ∇).
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
# Package __init__ re-export files carry deliberate import ordering — e.g.
# aquaflux/__init__.py must enable JAX x64 before any submodule import that
# builds JAX state, so those imports cannot be sorted or hoisted.
"**/__init__.py" = ["I001", "E402"]

[tool.codespell]
# Spelling gate for the Canadian convention used throughout this project:
# `colour`/`centre`/`labelled`, but `normalize`/`analyze`. The convention is a mix
# — British `-our`/`-re`/`-lled` but
# American `-ize`/`-yze` — so no stock dictionary matches it: an off-the-shelf
# `en-GB_to_en-US` list would wrongly "correct" `colour`/`centre`/`neighbour`.
# `tools/canadian-spelling.dict` is therefore a targeted custom list of the
# `-ise`/`-yse` spellings of `-ize`/`-yze` words only; codespell's built-in
# dictionaries are deliberately not enabled, so it flags nothing else.
dictionary = "tools/canadian-spelling.dict"
skip = "*.pyc,.git,build,dist,*.egg-info,.ruff_cache,.pytest_cache"

[tool.pytest.ini_options]
markers = [
    "validation: scientific validation against analytical/published solutions (slow)",
    "slow: multi-minute solves; excluded from the fast gate, run in full on merge",
    "distributed: spawns a fresh interpreter per test to compile a multi-device program; run in its own CI job so these do not oversubscribe the runner",
]
testpaths = ["tests"]
# A marker that is not declared above becomes a collection ERROR rather than a warning. The tiers are
# selected with `-m`, so a mistyped marker does not fail — it silently changes which tier a test
# belongs to, and the direction that matters is the quiet one: a heavy solve whose `@pytest.mark.slwo`
# never registers lands in the always-on gate, and a test meant for the fast gate whose marker is
# mistyped the other way stops running on every pull request. Neither shows up as a failure; both show
# up as a timing or a coverage surprise weeks later. `strict_config` does the same for an unknown key
# in this section, so a typo here cannot leave the whole block silently inert.
#
# These are the ini forms. The equivalent command-line flags exist too, but putting them in `addopts`
# does NOT work: the flag only enables the option when it is given on the command line, so an
# `addopts` entry parses cleanly and has no effect — which is exactly the silent-no-op shape these
# settings are here to prevent. (Both keys need pytest >= 9; an older pytest warns that it does not
# recognize them and behaves as before, so this degrades rather than breaks.)
strict_markers = true
strict_config = true

[tool.coverage.run]
source = ["aquaflux"]
branch = true
