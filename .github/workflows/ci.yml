name: CI

# The always-on gates (lint + the fast test tiers) run on every pull request and
# every push to main. The memory-heavy tiers (slow, validation) run on push to
# main and, on a PR, opt-in via the `full-ci` label -- they are a visible signal,
# not a required check.
on:
  pull_request:
    # `labeled` is added so applying the `full-ci` label to an open PR triggers the
    # slow + validation tiers immediately, without needing a fresh push. The
    # always-on jobs skip the bare `labeled` action -- they already ran on the
    # latest commit.
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main]
  schedule:
    # Weekly (Mon 07:23 UTC): refresh `.test_durations` so the slow/validation
    # pytest-split shards stay duration-balanced as tests are added. Only the
    # refresh-durations / commit-durations jobs run on this event; every other job
    # is gated off it.
    - cron: "23 7 * * 1"
  # Manual trigger for the same refresh (e.g. to populate the durations
  # immediately instead of waiting for the weekly cron). Note that GitHub only
  # registers this trigger from the DEFAULT branch, which is why the refresh job
  # additionally accepts a PR label below -- that is the only way to populate the
  # file from a branch before it has merged.
  workflow_dispatch:

# Concurrency, by event:
#  - a PR `labeled` event gets its OWN group (`fullci-<ref>`), separate from the
#    fast gate, so applying `full-ci` spins up the slow+validation run without
#    cancelling (or being starved by) the required fast gate.
#  - a push to main is keyed on the immutable commit SHA and never cancelled, so a
#    rapid second merge cannot cancel the first merge's run.
#  - every other PR event is keyed on the ref and cancels superseded runs.
concurrency:
  group: >-
    ${{ github.workflow }}-${{
      (github.event_name == 'pull_request' && github.event.action == 'labeled')
      && format('fullci-{0}', github.ref)
      || (github.event_name == 'push' && github.sha)
      || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

# Pin XLA/BLAS to a single thread per process so pytest-xdist workers do not
# oversubscribe the runner's CPUs -- each JAX process otherwise grabs every core,
# and N workers x M cores thrashes. With this, `-n auto` scales cleanly.
env:
  OMP_NUM_THREADS: "1"
  XLA_FLAGS: "--xla_cpu_multi_thread_eigen=false"

jobs:
  # ---- Lint gate: ruff + codespell (always-on) --------------------------------
  # Static checks only -- no JAX import, no compile -- so it is cheap. This is the
  # same set of commands the local pre-push hook runs (.githooks/pre-push).
  lint:
    name: ruff
    if: >-
      github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
      && github.event.action != 'labeled'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          # Lint results do not depend on the interpreter -- ruff reads its own
          # `target-version` from pyproject.toml. This version only governs the
          # install below.
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      # Installs ruff and codespell at the versions pinned by the `lint` extra,
      # so the gate cannot move under us when a new release is published.
      - name: Install the pinned linters
        run: pip install -e ".[lint]"

      # `docs` is in scope because `docs/conf.py` is real code -- it generates the
      # API reference from each subpackage's `__all__` -- and nothing else checks
      # it. Naming the directory rather than the file covers a second docs script
      # automatically; it is the only Python under `docs/`.
      - name: ruff check
        run: ruff check aquaflux tests docs

      # Report later failures even when an earlier step already failed -- one red
      # run should show every problem to fix, not just the first.
      - name: ruff format --check
        if: ${{ !cancelled() }}
        run: ruff format --check aquaflux tests docs

      # Canadian spelling gate (custom dictionary; config in pyproject.toml).
      - name: codespell
        if: ${{ !cancelled() }}
        run: codespell aquaflux tests

  # ---- Docs build (always-on) -------------------------------------------------
  # Read the Docs builds the site with `fail_on_warning`, and only AFTER a merge --
  # so without this job a broken cross-reference, a page missing from a toctree, or
  # a Sphinx dependency the `docs` extra forgot to declare is invisible to every PR
  # check and surfaces as a red site on main. This mirrors the Read the Docs build:
  # the same interpreter, the same `docs` extra, and the same command with warnings
  # as errors. autodoc imports the package, so this installs aquaflux and its
  # runtime dependencies as well as the Sphinx toolchain.
  docs:
    name: docs build
    if: >-
      github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
      && github.event.action != 'labeled'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          # The interpreter Read the Docs builds with (see .readthedocs.yaml).
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package and docs dependencies
        run: pip install -e ".[docs]"

      - name: Build the docs (warnings are errors)
        # -W turns any warning into a failure, --keep-going reports every one of
        # them rather than stopping at the first.
        run: sphinx-build -T -W --keep-going -j auto -b html docs docs/_build/html

  # ---- Fast unit tests (always-on) --------------------------------------------
  # Most unit tests are cheap and homogeneous (peak ~5 GB in one process), so they
  # run unsharded across xdist workers (`-n auto`). The wall-clock driver, though, is
  # the handful of distributed (`shard_map`) tests, each of which spawns a fresh
  # interpreter to set the simulated device count before JAX starts and then compiles
  # a sharded program -- that fixed cost, not the cheap tests, sets the budget below.
  # Two interpreters, since a unit-level regression can be version-specific.
  unit:
    name: unit tests (py${{ matrix.python-version }})
    if: >-
      github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
      && github.event.action != 'labeled'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package and test dependencies
        run: pip install -e ".[test]"

      - name: Run unit tests
        # `not slow and not validation`: a few unit tests carry those markers and
        # belong to the heavier tiers below. --timeout names a deadlocked test
        # instead of hanging; --max-worker-restart=0 fails the run on a crashed
        # (e.g. OOM-killed) worker rather than silently retrying.
        run: >-
          pytest tests/unit -m "not slow and not validation" -q -n auto
          --timeout=300 --timeout-method=thread --max-worker-restart=0

  # ---- Fast integration tests (always-on, sharded) ----------------------------
  # The differentiable flow-solve integration tests each build and adjoint a
  # coupled Newton solve; run serially in one process their accumulated XLA
  # compilation cache + live JAX buffers reach ~15 GB (at the 16 GB hosted-runner
  # ceiling). They are homogeneous, so pytest-split's even-by-count partition
  # balances memory as well as time: each of the 6 shards runs ~1/6 of the set in
  # a fresh process (peak a few GB), and `-n 1` keeps a shard from holding several
  # heavy solves at once. These fast tests are deliberately NOT recorded in
  # `.test_durations` (only the heterogeneous slow/validation tiers are), so this
  # partition stays even-by-count -- duration-balancing them could pile many fast
  # solves into one shard and unbalance memory. The per-shard jobs are not the
  # required check -- the `fast-gate` aggregator below is.
  integration:
    name: integration tests (py${{ matrix.python-version }} shard ${{ matrix.group }}/6)
    if: >-
      github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
      && github.event.action != 'labeled'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
        group: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package and test dependencies
        run: pip install -e ".[test]"

      - name: Run integration tests shard
        run: >-
          pytest tests/integration -m "not slow and not validation" -q -n 1
          --splits 6 --group ${{ matrix.group }}
          --durations=15 --timeout=900 --timeout-method=thread --max-worker-restart=0

  # ---- Fast-gate aggregator: the single required status check ------------------
  # Sharding renames the per-shard jobs (and their count may change), so make ONE
  # stable job the required check. It passes iff the lint, docs, unit and
  # integration matrices all passed (or were skipped -- a bare `labeled` event skips
  # them, which must not block). Update branch protection to require `fast gate`.
  fast-gate:
    name: fast gate
    needs: [lint, docs, unit, integration]
    if: >-
      always() && github.event_name != 'schedule'
      && github.event_name != 'workflow_dispatch'
      && github.event.action != 'labeled'
    runs-on: ubuntu-latest
    steps:
      - name: Require the always-on gates to pass
        run: |
          for job in lint docs unit integration; do
            case "$job" in
              lint) r="${{ needs.lint.result }}" ;;
              docs) r="${{ needs.docs.result }}" ;;
              unit) r="${{ needs.unit.result }}" ;;
              integration) r="${{ needs.integration.result }}" ;;
            esac
            echo "$job: $r"
            if [ "$r" != "success" ] && [ "$r" != "skipped" ]; then
              echo "::error::$job did not pass (result: $r)"
              exit 1
            fi
          done

  # ---- Slow suite: merge-to-main + opt-in on a PR -----------------------------
  # The multi-minute solves marked `slow`. Runs on every push to main so a
  # regression the fast gate cannot catch surfaces within minutes of landing, and
  # on a PR carrying the `full-ci` label (the opt-in pre-merge check). Sharded
  # `-n 1` for the same accumulated-memory reason as the integration tier.
  #
  # These tests are heterogeneous -- a 21 s scheme check next to a 242 s adjoint
  # continuation -- so pytest-split partitions them by recorded duration from the
  # committed `.test_durations`, which the refresh job below keeps current. A test
  # with no recorded duration gets the fallback average.
  #
  # Balancing by DURATION rather than by count is not a nicety. With no durations
  # pytest-split splits evenly by count over the whole collected set, so adding a
  # test anywhere shifts the boundaries and can migrate the expensive tests onto
  # whichever shard is already heaviest. That happened: eight unrelated unit tests
  # moved two ~106 s adjoint tests off the lightest shard (15:53) onto the heaviest
  # (20:58), which then needed ~24.5 min of tests plus ~5 min of setup and was
  # killed at the 30-minute ceiling.
  slow:
    name: slow suite (shard ${{ matrix.group }}/3)
    if: >-
      github.event_name == 'push'
      || (github.event_name == 'pull_request'
          && contains(github.event.pull_request.labels.*.name, 'full-ci'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        group: [1, 2, 3]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          # 3.12 only: the heavy tiers run on a single interpreter as a cost
          # saving; the fast gate already exercises 3.11 + 3.12.
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package and test dependencies
        run: pip install -e ".[test]"

      - name: Run slow suite shard
        # `slow and not validation` keeps the tiers disjoint (a test marked both
        # runs in the validation job, not here). Split across 3 shards (was 2) so
        # each single-process (`-n 1`) shard runs fewer tests and accumulates less
        # XLA compilation memory before the runner ceiling -- a 2-shard process
        # aborted part way through the coupled/segregated solves.
        run: |
          set +e
          pytest -m "slow and not validation" -q -n 1 \
            --splits 3 --group ${{ matrix.group }} \
            --durations=15 --timeout=900 --timeout-method=thread --max-worker-restart=0
          ec=$?
          # Exit 5 = pytest collected no tests. pytest-split's duration-based
          # partition front-loads the groups, so as `.test_durations` skews a
          # trailing shard can go empty; every test still runs in another shard.
          # Treat "no tests collected" as a pass -- a real failure exits non-5.
          if [ "$ec" -eq 5 ]; then
            echo "Empty shard ${{ matrix.group }} (no tests collected); treating as pass."
            exit 0
          fi
          exit $ec

  # ---- Validation suite (against analytical/published solutions) --------------
  # The heaviest tests in the repo: run serially in one process they reach ~16 GB
  # (the runner ceiling). Split across 5 fresh processes so each holds only a
  # slice. Same triggers as the slow tier. Like the slow tier, pytest-split
  # partitions these by recorded duration from `.test_durations` so each shard's
  # wall time is balanced; the counts are uneven by design (a shard of many cheap
  # tests balances one of a few heavy solves, and the cheap tests are also the
  # lower-memory ones). The duration split front-loads, so a trailing shard can be
  # empty -- the run step treats that (pytest exit 5) as a pass.
  validation:
    name: validation suite (shard ${{ matrix.group }}/5)
    if: >-
      github.event_name == 'push'
      || (github.event_name == 'pull_request'
          && contains(github.event.pull_request.labels.*.name, 'full-ci'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        group: [1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package and test dependencies
        run: pip install -e ".[test]"

      - name: Run validation suite shard
        run: |
          set +e
          pytest -m "validation" -q -n 1 \
            --splits 5 --group ${{ matrix.group }} \
            --durations=15 --timeout=900 --timeout-method=thread --max-worker-restart=0
          ec=$?
          # Exit 5 = pytest collected no tests. pytest-split's duration-based
          # partition front-loads the groups, so as `.test_durations` skews a
          # trailing shard can go empty; every test still runs in another shard.
          # Treat "no tests collected" as a pass -- a real failure exits non-5.
          if [ "$ec" -eq 5 ]; then
            echo "Empty shard ${{ matrix.group }} (no tests collected); treating as pass."
            exit 0
          fi
          exit $ec

  # ---- Refresh of .test_durations (schedule / manual / opt-in on a PR) ---------
  # The slow (3) and validation (5) jobs pytest-split-shard by `.test_durations`;
  # as tests are added the file drifts (a test with no recorded duration gets the
  # fallback average), so the shards lose their duration balance. This job
  # re-records every slow/validation test's duration.
  #
  # It runs `slow or validation` ACROSS SHARDS with `--store-durations` (each shard
  # records its own slice -- recording the whole set in one process would OOM the
  # runner, the same reason the suites are sharded in the first place), uploads the
  # per-shard files, and the commit job merges them into a complete
  # `.test_durations`. A complete, disjoint partition, so every test is recorded
  # exactly once and stale entries (tests no longer slow/validation) are pruned.
  # 8 shards keeps each fresh process to a handful of tests -- bounded memory on
  # the 16 GB runner even though the union spans the heaviest tests in the repo.
  #
  # THE PR LABEL IS THE BOOTSTRAP PATH, and it is not redundant with
  # `workflow_dispatch`: GitHub only registers `workflow_dispatch` from the DEFAULT
  # branch, so before this workflow has merged there is no way to dispatch it on a
  # branch. Without the label a first population would need the infrastructure
  # merged, then a dispatch, then a second merge -- with the shards still
  # count-balanced (and therefore still able to time out) throughout. Labelling a
  # PR `refresh-durations` records the file on that branch instead, so the
  # infrastructure and its data land together.
  #
  # The PR path fires on the `labeled` ACTION only, not merely on the label being
  # present: this is eight jobs of up to an hour, so it should run when someone asks
  # for it and not again on every subsequent push while the label happens to still
  # be attached. Re-run it by removing and re-applying the label.
  refresh-durations:
    name: refresh test-durations (shard ${{ matrix.group }}/8)
    if: >-
      github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
      || (github.event_name == 'pull_request' && github.event.action == 'labeled'
          && contains(github.event.pull_request.labels.*.name, 'refresh-durations'))
    runs-on: ubuntu-latest
    # Generous ceiling: this job records into fresh per-shard paths, so its own
    # split is even-by-count (unbalanced) -- a shard can bunch several heavy tests
    # and run longer than a duration-balanced steady-state shard.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        group: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package and test dependencies
        run: pip install -e ".[test]"

      - name: Record this shard's durations
        run: >-
          pytest -m "slow or validation" -q -n 1
          --splits 8 --group ${{ matrix.group }}
          --store-durations --durations-path durations-${{ matrix.group }}.json
          --timeout=1200 --timeout-method=thread --max-worker-restart=0

      - name: Upload shard durations
        uses: actions/upload-artifact@v4
        with:
          name: durations-${{ matrix.group }}
          path: durations-${{ matrix.group }}.json
          if-no-files-found: error

  # ---- Commit the refreshed durations (schedule / manual only) ----------------
  # Deliberately NOT run for the `refresh-durations` PR label: on a PR the point is
  # to land the file in that PR, so the artifacts are downloaded and committed by
  # hand (`gh run download`, then commit `.test_durations`). Opening a second,
  # bot-authored PR against main from a feature branch's run would target the wrong
  # base and race the PR being prepared.
  commit-durations:
    name: open .test_durations refresh PR
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: refresh-durations          # only proceed on a COMPLETE set (all shards ok)
    runs-on: ubuntu-latest
    permissions:
      contents: write                 # write .test_durations via the Contents API
      pull-requests: write            # open the PR
    steps:
      - uses: actions/checkout@v6

      - name: Download all shard durations
        uses: actions/download-artifact@v4
        with:
          pattern: durations-*
          path: _durations
          merge-multiple: true

      - name: Merge into .test_durations
        run: |
          python - <<'PY'
          import glob, json
          combined = {}
          for f in sorted(glob.glob("_durations/durations-*.json")):
              combined.update(json.load(open(f)))
          if not combined:
              raise SystemExit("no shard durations found -- aborting")
          # Match the committed format exactly (sorted keys, indent=4) so an
          # unchanged set is a no-op diff.
          with open(".test_durations", "w") as fh:
              json.dump(dict(sorted(combined.items())), fh, indent=4)
          print(f"merged {len(combined)} test durations")
          PY

      - name: Open / update the refresh PR if changed
        # `main` is branch-protected, so this does NOT push to it: it puts the
        # change on a single rolling `ci/refresh-test-durations` branch and opens
        # one PR you merge. Two GITHUB_TOKEN limitations shape HOW:
        #   1. The token may not push a *branch* whose tree carries the repo's
        #      workflow files (a new branch "introduces" .github/workflows/* and
        #      the token lacks the un-grantable `workflows` permission). So the
        #      commit is made through the GitHub Contents API, which writes ONLY
        #      .test_durations and never pushes workflow content -- no PAT needed.
        #   2. Opening a PR from the token needs the repo setting "Allow GitHub
        #      Actions to create and approve pull requests" (Settings -> Actions
        #      -> General). If it is off, `gh pr create` fails -- so that failure
        #      is non-fatal: the branch is still updated and you open the PR once
        #      by hand (or enable the setting and it auto-opens thereafter).
        # CI does not run on a bot-authored PR, so merge it with your admin bypass
        # (it touches only .test_durations).
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if git diff --quiet -- .test_durations; then
            echo "No change to .test_durations -- nothing to do."
            exit 0
          fi
          repo="$GITHUB_REPOSITORY"
          branch="ci/refresh-test-durations"
          base_sha="$(git rev-parse HEAD)"   # the checked-out main commit

          # Point the rolling branch at the current main (create, or reset if it
          # already exists) so the PR diff is exactly this run's durations change.
          if gh api "repos/$repo/git/refs/heads/$branch" >/dev/null 2>&1; then
            gh api -X PATCH "repos/$repo/git/refs/heads/$branch" \
              -f sha="$base_sha" -F force=true >/dev/null
          else
            gh api -X POST "repos/$repo/git/refs" \
              -f ref="refs/heads/$branch" -f sha="$base_sha" >/dev/null
          fi

          # Commit ONLY .test_durations onto the branch via the Contents API.
          file_sha="$(gh api "repos/$repo/contents/.test_durations?ref=$branch" --jq .sha)"
          gh api -X PUT "repos/$repo/contents/.test_durations" \
            -f message="ci: refresh .test_durations" \
            -f content="$(base64 -w0 .test_durations)" \
            -f branch="$branch" \
            -f sha="$file_sha" >/dev/null
          echo "Updated $branch with the refreshed durations."

          # Open the PR if one isn't already open. Non-fatal if the repo setting
          # blocks Actions from creating PRs (see note above).
          if [ -n "$(gh pr list --head "$branch" --state open --json number --jq '.[0].number')" ]; then
            echo "Refresh PR already open; its branch was updated in place."
          elif gh pr create --base main --head "$branch" \
              --title "ci: refresh .test_durations" \
              --body "Automated refresh of the pytest-split durations that balance the slow/validation shards. **Metadata-only** (only \`.test_durations\` changes), so it is safe to merge. Opened by the \`refresh-durations\` job via the GitHub API; CI does not run on bot-authored PRs, so merge with your admin override."; then
            echo "Opened the refresh PR."
          else
            echo "::warning::Branch '$branch' was updated but the PR could not be "\
              "opened automatically. Enable 'Allow GitHub Actions to create and "\
              "approve pull requests' (Settings -> Actions -> General), or open a "\
              "PR from '$branch' by hand once -- later runs reuse it."
          fi
